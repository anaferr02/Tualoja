<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - TuAloja</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f3f5fb;
      color: #222;
    }

    header {
      background: #fff;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      text-decoration: none;
      color: #1b167f;
    }

    .volver {
      background: #1b167f;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1300px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      color: #1b167f;
      margin-bottom: 20px;
    }

    #selectAlojamiento {
      width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .controles {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .controles button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 10px;
      background: #1b167f;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #mesActual {
      font-size: 28px;
      font-weight: bold;
      color: #1b167f;
      min-width: 220px;
      text-align: center;
    }

    .diasSemana {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .diasSemana div {
      background: #1b167f;
      color: white;
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
    }

    #calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .dia {
      background: white;
      height: 120px;
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
      cursor: pointer;
      transition: .2s;
      display: flex;
      flex-direction: column;
    }

    .dia:hover {
      transform: scale(1.03);
    }

    .numero {
      font-size: 18px;
      font-weight: bold;
    }

    .info {
      margin-top: auto;
      font-size: 12px;
    }

    .libre {
      background: #e9ffe8;
    }

    .ocupado {
      background: #ffd9d9;
    }

    .bloqueado {
      background: #ffe9a8 !important;
      color: #222 !important;
    }

    .seleccionado {
      background: #4f8cff !important;
      color: #fff;
      border: 3px solid #1b167f;
    }

    .inicioRango {
      border-left: 5px solid #1b167f;
    }

    .finRango {
      border-right: 5px solid #1b167f;
    }

    .barraSeleccion {
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .barraSeleccion span {
      font-weight: bold;
      color: #1b167f;
    }

    .barraSeleccion button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #btnBloquearRango {
      background: #ff9800;
      color: white;
    }

    #btnDesbloquearRango {
      background: #2e7d32;
      color: white;
    }

    #btnCancelarSeleccion {
      background: #e53935;
      color: white;
    }

    .oculto {
      display: none;
    }

    .hoy {
      border: 3px solid #1b167f;
    }

    .vacio {
      background: transparent;
      box-shadow: none;
      cursor: default;
    }

    .modal {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .45);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: white;
      width: 420px;
      padding: 25px;
      border-radius: 15px;
    }

    .modal-box h2 {
      margin-bottom: 15px;
      color: #1b167f;
    }

    .modal-box button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #1b167f;
      color: white;
      cursor: pointer;
    }

    @media(max-width:900px) {
      #calendario {
        grid-template-columns: repeat(2, 1fr);
      }

      .diasSemana {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">TuAloja</a>
    <a class="volver" href="panel-anfitrion.html">← Volver al Panel</a>
  </header>

  <main>
    <h1>Calendario de Disponibilidad</h1>

    <select id="selectAlojamiento">
      <option value="">Seleccionar alojamiento</option>
    </select>

    <div class="barraSeleccion">
      <span>Desde: <b id="fechaInicioTexto">-</b></span>
      <span>Hasta: <b id="fechaFinTexto">-</b></span>
      <button id="btnBloquearRango" class="oculto">Bloquear rango</button>
      <button id="btnDesbloquearRango" class="oculto">Desbloquear rango</button>
      <button id="btnCancelarSeleccion" class="oculto">Cancelar</button>
    </div>

    <div class="controles">
      <button id="anterior">◀</button>
      <div id="mesActual"></div>
      <button id="siguiente">▶</button>
    </div>

    <div class="diasSemana">
      <div>Dom</div>
      <div>Lun</div>
      <div>Mar</div>
      <div>Mié</div>
      <div>Jue</div>
      <div>Vie</div>
      <div>Sáb</div>
    </div>

    <div id="calendario"></div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>Información del día</h2>
      <div id="contenidoModal"></div>
      <button onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

 <script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    query,
    where
  } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  let usuarioActual = null;
  let alojamientos = [];
  let reservas = [];
  let fechasBloqueadas = [];
  let alojamientoSeleccionado = "";
  let fechaInicio = null;
  let fechaFin = null;

  let fecha = new Date();
  let mes = fecha.getMonth();
  let anio = fecha.getFullYear();

  const calendario = document.getElementById("calendario");
  const mesActual = document.getElementById("mesActual");
  const select = document.getElementById("selectAlojamiento");
  const fechaInicioTexto = document.getElementById("fechaInicioTexto");
  const fechaFinTexto = document.getElementById("fechaFinTexto");
  const btnBloquearRango = document.getElementById("btnBloquearRango");
  const btnDesbloquearRango = document.getElementById("btnDesbloquearRango");
  const btnCancelarSeleccion = document.getElementById("btnCancelarSeleccion");
  const modal = document.getElementById("modal");

  // Helper para convertir objeto Date a texto YYYY-MM-DD
  function formatearFecha(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  // INICIAR SESIÓN
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      alert("Debes iniciar sesión");
      location.href = "login.html";
      return;
    }

    usuarioActual = user;
    await cargarDatos();
    cancelarSeleccion();
  });

  // CARGAR ALOJAMIENTOS Y RESERVAS
  async function cargarDatos() {
    alojamientos = [];
    reservas = [];

    try {
      const alojSnap = await getDocs(collection(db, "alojamientos"));
      alojSnap.forEach((doc) => {
        const a = doc.data();
        if (
          a.anfitrionId === usuarioActual.uid ||
          a.ownerUid === usuarioActual.uid ||
          a.ownerId === usuarioActual.uid
        ) {
          alojamientos.push({ id: doc.id, ...a });
        }
      });

      select.innerHTML = `<option value="">Seleccionar alojamiento</option>`;
      alojamientos.forEach((a) => {
        select.innerHTML += `<option value="${a.id}">${a.titulo || a.nombre || "Sin nombre"}</option>`;
      });

      const reservasSnap = await getDocs(collection(db, "reservas"));
      reservasSnap.forEach((doc) => {
        const r = doc.data();
        if (r.anfitrionId === usuarioActual.uid) {
          reservas.push({ id: doc.id, ...r });
        }
      });
    } catch (err) {
      console.error("Error al cargar datos:", err);
    }
  }

  // CARGAR FECHAS BLOQUEADAS DE LA BASE DE DATOS
  async function cargarBloqueadas() {
    fechasBloqueadas = [];
    if (!alojamientoSeleccionado) return;

    try {
      const q = query(
        collection(db, "fechasBloqueadas"),
        where("alojamientoId", "==", alojamientoSeleccionado)
      );

      const snap = await getDocs(q);
      snap.forEach((doc) => {
        fechasBloqueadas.push({
          id: doc.id,
          ...doc.data()
        });
      });
    } catch (err) {
      console.error("Error al cargar fechas bloqueadas:", err);
    }
  }

  // CAMBIO DE ALOJAMIENTO
  select.addEventListener("change", async () => {
    alojamientoSeleccionado = select.value;
    await cargarBloqueadas();
    cancelarSeleccion();
  });

  function actualizarBarra() {
    fechaInicioTexto.textContent = fechaInicio || "-";
    fechaFinTexto.textContent = fechaFin || "-";

    const mostrar = !!(fechaInicio && fechaFin);
    btnBloquearRango.classList.toggle("oculto", !mostrar);
    btnDesbloquearRango.classList.toggle("oculto", !mostrar);
    btnCancelarSeleccion.classList.toggle("oculto", !mostrar);
  }

  function cancelarSeleccion() {
    fechaInicio = null;
    fechaFin = null;
    actualizarBarra();
    renderCalendario();
  }

  function fechaDentroDelRango(fechaTexto) {
    if (!fechaInicio || !fechaFin) return false;
    return fechaTexto >= fechaInicio && fechaTexto <= fechaFin;
  }

  btnCancelarSeleccion.onclick = () => {
    cancelarSeleccion();
  };

  // DIBUJAR CALENDARIO
  function renderCalendario() {
    calendario.innerHTML = "";

    const primerDia = new Date(anio, mes, 1).getDay();
    const diasMes = new Date(anio, mes + 1, 0).getDate();
    const meses = [
      "Enero", "Febrero", "Marzo", "Abril",
      "Mayo", "Junio", "Julio", "Agosto",
      "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    mesActual.textContent = meses[mes] + " " + anio;

    // Celdas vacías del inicio de mes
    for (let i = 0; i < primerDia; i++) {
      const vacio = document.createElement("div");
      vacio.className = "vacio";
      calendario.appendChild(vacio);
    }

    const hoyTexto = formatearFecha(new Date());

    for (let dia = 1; dia <= diasMes; dia++) {
      const fechaTexto = `${anio}-${String(mes + 1).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;

      const cuadro = document.createElement("div");
      let texto = "🟢 Disponible";
      let claseEstado = "libre";

      // Buscar si está reservado
      const reserva = reservas.find((r) =>
        r.alojamientoId === alojamientoSeleccionado &&
        fechaTexto >= r.checkin &&
        fechaTexto < r.checkout
      );

      // Buscar si está bloqueado por el anfitrión
      const bloqueo = fechasBloqueadas.find((f) => String(f.fecha).trim() === fechaTexto);

      if (reserva) {
        claseEstado = "ocupado";
        texto = "🔴 Reservado";
      } else if (bloqueo) {
        claseEstado = "bloqueado";
        texto = "🟡 Bloqueado";
      }

      cuadro.className = `dia ${claseEstado}`;

      if (fechaDentroDelRango(fechaTexto)) {
        cuadro.classList.add("seleccionado");
      }
      if (fechaTexto === fechaInicio) {
        cuadro.classList.add("inicioRango");
      }
      if (fechaTexto === fechaFin) {
        cuadro.classList.add("finRango");
      }
      if (fechaTexto === hoyTexto) {
        cuadro.classList.add("hoy");
      }

      cuadro.innerHTML = `
        <div class="numero">${dia}</div>
        <div class="info">${texto}</div>
      `;

      cuadro.onclick = () => {
        if (reserva) return; 

        if (!fechaInicio) {
          fechaInicio = fechaTexto;
          fechaFin = null;
        } else if (!fechaFin) {
          fechaFin = fechaTexto;
          if (fechaInicio > fechaFin) {
            const aux = fechaInicio;
            fechaInicio = fechaFin;
            fechaFin = aux;
          }
        } else {
          fechaInicio = fechaTexto;
          fechaFin = null;
        }

        actualizarBarra();
        renderCalendario();
      };

      calendario.appendChild(cuadro);
    }
  }

  // ACCIÓN DE BLOQUEAR EN FIREBASE
  btnBloquearRango.onclick = async () => {
    if (!fechaInicio || !fechaFin) {
      alert("Seleccioná un rango.");
      return;
    }
    if (!alojamientoSeleccionado) {
      alert("Seleccioná un alojamiento arriba en el menú desplegable.");
      return;
    }

    btnBloquearRango.disabled = true;
    btnBloquearRango.textContent = "Bloqueando...";

    try {
      const [aY, aM, aD] = fechaInicio.split("-").map(Number);
      const [fY, fM, fD] = fechaFin.split("-").map(Number);

      let fechaActual = new Date(aY, aM - 1, aD);
      const fechaLimite = new Date(fY, fM - 1, fD);

      const promesas = [];

      while (fechaActual <= fechaLimite) {
        const textoFecha = formatearFecha(fechaActual);

        const yaExiste = fechasBloqueadas.some((f) => String(f.fecha).trim() === textoFecha);
        const yaReservada = reservas.some((r) =>
          r.alojamientoId === alojamientoSeleccionado &&
          textoFecha >= r.checkin &&
          textoFecha < r.checkout
        );

        if (!yaExiste && !yaReservada) {
          promesas.push(
            addDoc(collection(db, "fechasBloqueadas"), {
              alojamientoId: alojamientoSeleccionado,
              fecha: textoFecha,
              motivo: "Bloqueado por anfitrión",
              anfitrionId: usuarioActual.uid,
              createdAt: new Date()
            })
          );
        }

        fechaActual.setDate(fechaActual.getDate() + 1);
      }

      // Guardar todo de forma simultánea
      await Promise.all(promesas);

      await cargarBloqueadas();
      cancelarSeleccion();
      alert("¡Fechas bloqueadas con éxito!");
    } catch (error) {
      console.error("Error al guardar bloqueo:", error);
      alert("Ocurrió un error al guardar en la base de datos: " + error.message);
    } finally {
      btnBloquearRango.disabled = false;
      btnBloquearRango.textContent = "Bloquear rango";
    }
  };

  // ACCIÓN DE DESBLOQUEAR EN FIREBASE
  btnDesbloquearRango.onclick = async () => {
    if (!fechaInicio || !fechaFin) {
      alert("Seleccioná un rango.");
      return;
    }

    btnDesbloquearRango.disabled = true;
    btnDesbloquearRango.textContent = "Desbloqueando...";

    try {
      const promesasEliminar = [];

      for (const bloqueo of fechasBloqueadas) {
        if (bloqueo.fecha >= fechaInicio && bloqueo.fecha <= fechaFin) {
          promesasEliminar.push(deleteDoc(doc(db, "fechasBloqueadas", bloqueo.id)));
        }
      }

      await Promise.all(promesasEliminar);

      await cargarBloqueadas();
      cancelarSeleccion();
      alert("¡Rango desbloqueado!");
    } catch (error) {
      console.error("Error al desbloquear:", error);
      alert("Error al intentar desbloquear: " + error.message);
    } finally {
      btnDesbloquearRango.disabled = false;
      btnDesbloquearRango.textContent = "Desbloquear rango";
    }
  };

  // NAVEGACIÓN DE MESES
  document.getElementById("anterior").onclick = () => {
    mes--;
    if (mes < 0) {
      mes = 11;
      anio--;
    }
    renderCalendario();
  };

  document.getElementById("siguiente").onclick = () => {
    mes++;
    if (mes > 11) {
      mes = 0;
      anio++;
    }
    renderCalendario();
  };

  window.cerrarModal = function () {
    modal.style.display = "none";
  };
</script>
</body>

</html>
