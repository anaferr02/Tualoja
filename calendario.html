<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendario TuAloja</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
background:#f3f5fb;
color:#222;
}


header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}


.logo{
font-size:30px;
font-weight:bold;
color:#1b167f;
text-decoration:none;
}


.volver{

background:#1b167f;
color:white;
padding:12px 18px;
border-radius:12px;
text-decoration:none;

}


main{

max-width:1200px;
margin:30px auto;
padding:20px;

}


h1{

color:#1b167f;

}


select{

padding:12px;
border-radius:10px;
border:1px solid #ddd;
width:300px;
margin-bottom:20px;

}



.controles{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}


.controles button{

background:#1b167f;
color:white;
border:0;
width:45px;
height:45px;
border-radius:10px;
cursor:pointer;

}



#mesActual{

font-size:28px;
font-weight:bold;
color:#1b167f;

}



.diasSemana{

display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;

}



.diasSemana div{

background:#1b167f;
color:white;
padding:12px;
text-align:center;
border-radius:10px;

}



#calendario{

display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
margin-top:10px;

}



.dia{

height:120px;
background:white;
border-radius:15px;
padding:10px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
cursor:pointer;

}



.numero{

font-size:18px;
font-weight:bold;

}


.libre{

background:#e5ffe5;

}


.ocupado{

background:#ffd8d8;

}



.info{

font-size:12px;
margin-top:15px;

}



.modal{

display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;

}



.modal-box{

background:white;
padding:25px;
border-radius:15px;
width:400px;

}


.modal-box button{

background:#1b167f;
color:white;
border:0;
padding:10px;
border-radius:10px;

}



</style>

</head>


<body>


<header>

<a class="logo" href="index.html">
TuAloja
</a>


<a class="volver" href="panel-anfitrion.html">
← Volver al Panel
</a>


</header>



<main>


<h1>
Calendario de Disponibilidad
</h1>


<select id="selectAlojamiento">

<option value="">
Seleccionar alojamiento
</option>

</select>



<div class="controles">


<button id="anterior">
◀
</button>


<div id="mesActual"></div>


<button id="siguiente">
▶
</button>


</div>



<div class="diasSemana">

<div>Dom</div>
<div>Lun</div>
<div>Mar</div>
<div>Mié</div>
<div>Jue</div>
<div>Vie</div>
<div>Sáb</div>

</div>


<div id="calendario"></div>



</main>



<div class="modal" id="modal">

<div class="modal-box">

<h2>
Información
</h2>


<div id="contenidoModal"></div>


<button onclick="cerrarModal()">
Cerrar
</button>


</div>

</div>
<script type="module">

import { auth, db } from "./firebase-config.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";


import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";



let usuarioActual=null;

let alojamientos=[];

let reservas=[];

let alojamientoSeleccionado="";


let fecha=new Date();

let mes=fecha.getMonth();

let anio=fecha.getFullYear();



const calendario=document.getElementById("calendario");

const mesActual=document.getElementById("mesActual");

const select=document.getElementById("selectAlojamiento");



onAuthStateChanged(auth,async(user)=>{


if(!user){

alert("Debes iniciar sesión");

location.href="login.html";

return;

}


usuarioActual=user;


await cargarDatos();


renderCalendario();


});





async function cargarDatos(){


alojamientos=[];

reservas=[];



// CARGAR ALOJAMIENTOS

const alojSnap=
await getDocs(collection(db,"alojamientos"));



alojSnap.forEach((doc)=>{


let a=doc.data();



if(
a.anfitrionId===usuarioActual.uid ||
a.ownerUid===usuarioActual.uid ||
a.ownerId===usuarioActual.uid
){


alojamientos.push({

id:doc.id,

...a

});


}



});





select.innerHTML=
`
<option value="">
Seleccionar alojamiento
</option>
`;



alojamientos.forEach(a=>{


select.innerHTML +=
`
<option value="${a.id}">
${a.titulo || a.nombre}
</option>
`;


});





// CARGAR RESERVAS


const reservasSnap=
await getDocs(collection(db,"reservas"));



reservasSnap.forEach(doc=>{


let r=doc.data();



if(r.anfitrionId===usuarioActual.uid){

reservas.push({

id:doc.id,

...r

});

}


});



}





select.addEventListener("change",()=>{


alojamientoSeleccionado=
select.value;


renderCalendario();


});






function renderCalendario(){


calendario.innerHTML="";



let primerDia=
new Date(anio,mes,1).getDay();



let cantidadDias=
new Date(anio,mes+1,0).getDate();



let nombres=[

"Enero",
"Febrero",
"Marzo",
"Abril",
"Mayo",
"Junio",
"Julio",
"Agosto",
"Septiembre",
"Octubre",
"Noviembre",
"Diciembre"

];



mesActual.textContent=
nombres[mes]+" "+anio;





for(let i=0;i<primerDia;i++){


let espacio=document.createElement("div");

calendario.appendChild(espacio);


}




for(let dia=1;dia<=cantidadDias;dia++){



let caja=document.createElement("div");


caja.className="dia libre";



let fechaTexto=
anio+"-"+

String(mes+1).padStart(2,"0")
+"-"+
String(dia).padStart(2,"0");



let reservaDia=
reservas.find(r=>{


return (

r.alojamientoId===alojamientoSeleccionado &&

fechaTexto>=r.checkin &&

fechaTexto<r.checkout

);


});




if(reservaDia){


caja.className="dia ocupado";


caja.innerHTML=
`
<div class="numero">
${dia}
</div>

<div class="info">

🔴 Reservado

<br>

${reservaDia.titulo || reservaDia.alojamientoTitulo || ""}

</div>

`;



}else{


caja.innerHTML=
`
<div class="numero">
${dia}
</div>

<div class="info">
🟢 Disponible
</div>

`;


}




caja.onclick=()=>{


document.getElementById("modal").style.display="flex";


document.getElementById("contenidoModal").innerHTML=

`
Fecha:
<b>${fechaTexto}</b>
<br><br>

${
reservaDia ?

"Reserva: "+(reservaDia.titulo || reservaDia.alojamientoTitulo)

:

"Disponible"

}

`;


};



calendario.appendChild(caja);



}




}






document.getElementById("anterior").onclick=()=>{


mes--;


if(mes<0){

mes=11;

anio--;

}


renderCalendario();


};





document.getElementById("siguiente").onclick=()=>{


mes++;


if(mes>11){

mes=0;

anio++;

}


renderCalendario();


};





window.cerrarModal=function(){


document.getElementById("modal").style.display="none";


}



</script>


</body>
</html>
